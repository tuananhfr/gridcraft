[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"
publish = false

[lints]
workspace = true

[dependencies]
unicode-normalization = "0.1"
gridcraft-vbarun = { workspace = true }
gridcraft-vba = { workspace = true }
sha2 = { workspace = true }
gridcraft-mdb = { workspace = true }
gridcraft-dxf = { path = "../dxf" }
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-chart = { workspace = true }
gridcraft-pdf = { workspace = true }
image = { workspace = true }

[dev-dependencies]
gridcraft-vba = { workspace = true, features = ["test-support"] }
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
cfb = "0.15"
